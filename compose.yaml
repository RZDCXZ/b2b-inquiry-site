name: torquelis-inquiry-site

services:
  postgres:
    image: postgres:18-alpine@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
    environment:
      POSTGRES_DB: torquelis_demo
      POSTGRES_PASSWORD: torquelis_local_only
      POSTGRES_USER: torquelis
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U torquelis -d torquelis_demo"]
      interval: 2s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    volumes:
      - torquelis_postgres_data:/var/lib/postgresql

volumes:
  torquelis_postgres_data:
