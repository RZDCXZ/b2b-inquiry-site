name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24.18.0

      - name: Enable locked pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.21.0 --activate

      - name: Reproduce documented clean-clone setup (install, migrate, seed)
        run: pnpm setup

      - name: Record clean-clone evidence
        run: |
          mkdir -p test-results/reproduction
          git rev-parse HEAD | tee test-results/reproduction/clean-clone.txt
          node --version | tee -a test-results/reproduction/clean-clone.txt
          pnpm --version | tee -a test-results/reproduction/clean-clone.txt
          docker compose version | tee -a test-results/reproduction/clean-clone.txt
          pnpm demo:verify | tee -a test-results/reproduction/clean-clone.txt
          git diff --exit-code

      - name: Verify public repository safety
        run: pnpm verify:public

      - name: Check formatting
        run: pnpm format

      - name: Run static analysis
        run: pnpm lint

      - name: Run type checking
        run: pnpm typecheck

      - name: Run unit tests
        run: pnpm test

      - name: PostgreSQL integration tests
        run: pnpm test:integration

      - name: Reset and verify deterministic demo data
        run: |
          pnpm demo:reset
          pnpm demo:verify | tee test-results/reproduction/post-test-reset.txt

      - name: Production build
        run: pnpm build

      - name: Install browser matrix
        run: pnpm exec playwright install --with-deps chromium firefox webkit

      - name: Six-project cross-browser demonstration paths
        run: pnpm test:e2e

      - name: Upload reproducibility and browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-evidence-${{ github.sha }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 30

      - name: Stop isolated CI database
        if: always()
        run: docker compose down -v
